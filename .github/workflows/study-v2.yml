name: Study v2
# Design: 3 engines x (8 core + 3 variant) conditions = 33 cells, 100 datasets each,
# in 5 shards of 20 (165 jobs). Budget from probe run 39377209685, conservatively
# using the slowest probe dataset per engine x N x pool for every dataset:
# about 6,440 runner-minutes estimated; each shard's timeout is 3x its estimate
# (owner rule), so the hard ceiling is about 19,770 runner-minutes.
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: study-v2
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  shard:
    name: shard (${{ matrix.engine }}, ${{ matrix.n }}, ${{ matrix.pool }}, ${{ matrix.corr }}, ${{ matrix.ptype }}, ${{ matrix.shape }}, ${{ matrix.reps }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: linear, reps: '0:20', timeout: 40}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: linear, reps: '20:40', timeout: 40}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: linear, reps: '40:60', timeout: 35}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: linear, reps: '60:80', timeout: 30}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: linear, reps: '80:100', timeout: 30}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: u_shape, reps: '0:20', timeout: 40}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: u_shape, reps: '20:40', timeout: 40}
          - {engine: ols, n: 1000, pool: 13, corr: correlated, ptype: normal, shape: u_shape, reps: '40:60', timeout: 35}
