    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/study_v2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0
          python -m pip check
      - name: Run shard
        run: |
          # nproc honours OMP_NUM_THREADS=1, so ask Python for the CPU count.
          workers=$(python -c 'import os; print(os.cpu_count())')
          echo "cpu count: $workers"
          python -I examples/study_v2.py run --engine ${{ matrix.engine }} --n ${{ matrix.n }} --pool ${{ matrix.pool }} \
            --corr ${{ matrix.corr }} --ptype ${{ matrix.ptype }} --shape ${{ matrix.shape }} \
            --reps ${{ matrix.reps }} --out .shard --workers "$workers"
