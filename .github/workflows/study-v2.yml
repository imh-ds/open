        id: name
        run: echo "name=study-v2-${{ matrix.engine }}-${{ matrix.n }}-${{ matrix.pool }}-${{ matrix.corr }}-${{ matrix.ptype }}-${{ matrix.shape }}-$(echo '${{ matrix.reps }}' | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.name.outputs.name }}
          path: .shard/
          include-hidden-files: true
          if-no-files-found: error
  aggregate:
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/study_v2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # Shard artifacts only: "study-v2-results" from an earlier attempt must not match.
          pattern: study-v2-*-*-*-*
          path: shards
      - name: Aggregate
        run: |
          found=$(ls shards | wc -l)
          echo "shard artifacts: $found of 165"
          python -I examples/study_v2.py aggregate --inputs shards --out results
          cp -r shards results/shards
          echo "$found" > results/shard-count.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: study-v2-results
          path: results/
          if-no-files-found: error
