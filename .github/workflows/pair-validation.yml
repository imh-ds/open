name: Fresh pair validation development

on:
  workflow_dispatch:
  push:
    branches: [codex/actions-selection-reliability]
    paths: [.github/workflows/pair-validation.yml]

permissions:
  contents: read
concurrency:
  group: pair-validation-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  STUDY_OUT: .superpowers/pair-validation

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pair-validation-setup
      - id: matrix
        run: |
          $shards = python examples/pair_validation_study.py matrix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "shards=$shards" >> $env:GITHUB_OUTPUT

  screen:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pair-validation-setup
        timeout-minutes: 4
      - timeout-minutes: 22
        run: |
          python examples/pair_validation_study.py shard --id '${{ matrix.shard }}' --output $env:STUDY_OUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-shard-${{ matrix.shard }}
          path: .superpowers/pair-validation/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  aggregate:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, screen]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pair-validation-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: validation-shard-*
          path: .superpowers/pair-validation-downloads/
          merge-multiple: false
      - run: |
          python examples/pair_validation_study.py aggregate --input .superpowers/pair-validation-downloads --output $env:STUDY_OUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-combined-evidence
          path: |
            .superpowers/pair-validation/
            .superpowers/pair-validation-downloads/
            examples/study_manifests/pair-validation.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
