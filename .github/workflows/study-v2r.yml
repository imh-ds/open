          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r5s0,r5s1', reps: '32:36', timeout: 285}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r5s0,r5s1', reps: '36:40', timeout: 285}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r5s0,r5s1', reps: '40:44', timeout: 285}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r5s0,r5s1', reps: '44:48', timeout: 285}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r5s0,r5s1', reps: '48:50', timeout: 145}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r1s0,r1s1', reps: '0:22', timeout: 315}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r1s0,r1s1', reps: '22:44', timeout: 315}
          - {engine: lightgbm, n: 2000, shape: u_shape, runs: 'r1s0,r1s1', reps: '44:50', timeout: 85}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/study_v2.py
            examples/study_v2r.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0
          python -m pip check
      - name: Run shard
        run: |
          # nproc honours OMP_NUM_THREADS=1, so ask Python for the CPU count.
          workers=$(python -c 'import os; print(os.cpu_count())')
          echo "cpu count: $workers"
          python -I examples/study_v2r.py run --engine ${{ matrix.engine }} --n ${{ matrix.n }} \
            --shape ${{ matrix.shape }} --runs ${{ matrix.runs }} --reps ${{ matrix.reps }} \
            --out .shard --workers "$workers"
      - name: Name artifact
        id: name
        run: echo "name=study-v2r-${{ matrix.engine }}-${{ matrix.n }}-${{ matrix.shape }}-$(echo '${{ matrix.runs }}' | tr ',' '_')-$(echo '${{ matrix.reps }}' | tr ':' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.name.outputs.name }}
          path: .shard/
          include-hidden-files: true
          if-no-files-found: error
  aggregate:
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/study_v2.py
            examples/study_v2r.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # Shard artifacts only: "study-v2r-results" from an earlier attempt must not match.
          pattern: study-v2r-*-*-*-*-*
          path: shards
      - name: Aggregate
        run: |
          found=$(ls shards | wc -l)
          echo "shard artifacts: $found of 188"
          python -I examples/study_v2r.py aggregate --inputs shards --out results
          cp -r shards results/shards
          echo "$found" > results/shard-count.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: study-v2r-results
          path: results/
          if-no-files-found: error
