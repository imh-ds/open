name: Study v2-R
# Repeated splits: 3 engines x N (1000, 2000) x shape (linear, U), pool 25, datasets 0-49,
# each explored with repeats 1 and 5 under seeds 0 and 1 (one task per dataset and run).
# Budget from probe run 39465126146: about 7,700 runner-minutes at the probe's observed
# times; about 16,600 if every repeats-5 network grows to depth 3 (used for shard sizes).
# Each job's timeout is 3x its conservative estimate (owner rule): ceiling about 50,300.
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: study-v2r
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  shard:
    name: shard (${{ matrix.engine }}, ${{ matrix.n }}, ${{ matrix.shape }}, ${{ matrix.runs }}, ${{ matrix.reps }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {engine: ols, n: 1000, shape: linear, runs: 'r5s0,r5s1', reps: '0:4', timeout: 225}
          - {engine: ols, n: 1000, shape: linear, runs: 'r5s0,r5s1', reps: '4:8', timeout: 225}
