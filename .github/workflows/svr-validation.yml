name: SVR validation study
# SVR alone (docs/engines.md): 4 shapes x 3 sample sizes, 200 datasets per cell; N = 1000 cells run as two
# 100-dataset halves (the 360-minute job limit). Per-dataset seconds from probe run 39820966028
# (threshold and saturating assumed to cost what linear does). Estimated 832 runner-minutes;
# each timeout is 3x its estimate (owner rule), ceiling 2496 runner-minutes.
'on':
  workflow_dispatch: {}
  push:
    branches: [codex/exploratory-mode]
    paths: [.github/workflows/svr-validation.yml]
permissions:
  contents: read
concurrency:
  group: svr-validation
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Registration only; no computation.'
  cell:
    if: github.event_name == 'workflow_dispatch'
    name: cell (svr, ${{ matrix.n }}, ${{ matrix.shape }}${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {n: 300, shape: linear, reps: '0:200', part: '', timeout: 60}
          - {n: 300, shape: u_shape, reps: '0:200', part: '', timeout: 24}
          - {n: 300, shape: threshold, reps: '0:200', part: '', timeout: 60}
          - {n: 300, shape: saturating, reps: '0:200', part: '', timeout: 60}
          - {n: 500, shape: linear, reps: '0:200', part: '', timeout: 219}
          - {n: 500, shape: u_shape, reps: '0:200', part: '', timeout: 63}
          - {n: 500, shape: threshold, reps: '0:200', part: '', timeout: 219}
          - {n: 500, shape: saturating, reps: '0:200', part: '', timeout: 219}
          - {n: 1000, shape: linear, reps: '0:100', part: 'a', timeout: 213}
          - {n: 1000, shape: linear, reps: '100:200', part: 'b', timeout: 213}
          - {n: 1000, shape: u_shape, reps: '0:100', part: 'a', timeout: 147}
          - {n: 1000, shape: u_shape, reps: '100:200', part: 'b', timeout: 147}
          - {n: 1000, shape: threshold, reps: '0:100', part: 'a', timeout: 213}
          - {n: 1000, shape: threshold, reps: '100:200', part: 'b', timeout: 213}
          - {n: 1000, shape: saturating, reps: '0:100', part: 'a', timeout: 213}
          - {n: 1000, shape: saturating, reps: '100:200', part: 'b', timeout: 213}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/exploratory_validation.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0 PyYAML==6.0.2
          python -m pip check
      - name: Run cell
        run: |
          # nproc honours OMP_NUM_THREADS=1, so ask Python for the CPU count.
          workers=$(python -c 'import os; print(os.cpu_count())')
          echo "cpu count: $workers"
          python -I examples/exploratory_validation.py run --engine svr --n ${{ matrix.n }}             --shape ${{ matrix.shape }} --reps ${{ matrix.reps }} --out .cell --workers "$workers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: svr-cell-${{ matrix.n }}-${{ matrix.shape }}${{ matrix.part }}
          path: .cell/
          include-hidden-files: true
          if-no-files-found: error
  aggregate:
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    needs: cell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/exploratory_validation.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0 PyYAML==6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: svr-cell-*
          path: cells
      - name: Aggregate
        run: |
          found=$(ls cells | wc -l)
          echo "cell artifacts: $found of 16"
          python -I examples/exploratory_validation.py aggregate --inputs cells --out results
          cp -r cells results/cells
          echo "$found" > results/cell-count.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: svr-validation-results
          path: results/
          if-no-files-found: error
