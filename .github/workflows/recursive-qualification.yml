name: Fresh recursive qualification

on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [noise, signal]
        required: true
      noise_run:
        type: string
        description: Preserved qualified noise run; required for signal
  push:
    branches: [codex/actions-selection-reliability]
    paths: [.github/workflows/recursive-qualification.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: recursive-reference-validation
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
  STAGE: ${{ inputs.stage }}
  NOISE_RUN: ${{ inputs.noise_run }}

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: Write-Output 'Registration only; no model fits.'
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            .github/workflows/recursive-preview-validation.yml
            examples/recursive_preview_*.py
            examples/recursive_preview_validation_protocol.md
            examples/recursive_preview_continuation_proposal.md
            examples/study_manifests/recursive-preview-*.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/raw/producer-manifest.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/raw/preflight.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/audit/raw-sha256.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/audit/diagnosis.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38621370295/raw/producer-manifest.json
            examples/results/2026-10-14-recursive-preview-validation/timing-completed-38629900589/audit/verification.json
            examples/results/2026-10-14-recursive-preview-validation/timing-completed-38629900589/audit/raw-sha256.json
            examples/time_scenario_validation.py
            examples/qualify_recursive_validation.py
            examples/qualification_validation_protocol.md
            .github/workflows/recursive-qualification.yml
            examples/study_manifests/recursive-qualification*.json
            examples/results/2026-10-14-recursive-preview-validation/scenario-timing-completed-38645875109/audit/verification.json
            examples/results/2026-10-14-recursive-qualification/noise-gate/audit.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned package/runtime and verify source
        timeout-minutes: 2
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I examples/qualify_recursive_validation.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 runtime.txt
      - id: matrix
        name: Verify stage gates and authorize fixed fresh identities
        timeout-minutes: 8
        run: |
          $taskArgs = @('prepare', '--stage', $env:STAGE, '--out', '.superpowers/qualification-prepare')
          if ($env:STAGE -eq 'signal') { $taskArgs += @('--noise-run', $env:NOISE_RUN) }
          $taskMatrix = python -I examples/qualify_recursive_validation.py @taskArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "matrix=$taskMatrix" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 2
        with:
          name: qualification-${{ inputs.stage }}-authorization
          path: .superpowers/qualification-prepare/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  case:
    name: case (${{ matrix.id }})
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            .github/workflows/recursive-preview-validation.yml
            examples/recursive_preview_*.py
            examples/recursive_preview_validation_protocol.md
            examples/recursive_preview_continuation_proposal.md
            examples/study_manifests/recursive-preview-*.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/raw/producer-manifest.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/raw/preflight.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/audit/raw-sha256.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/audit/diagnosis.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38621370295/raw/producer-manifest.json
            examples/results/2026-10-14-recursive-preview-validation/timing-completed-38629900589/audit/verification.json
            examples/results/2026-10-14-recursive-preview-validation/timing-completed-38629900589/audit/raw-sha256.json
            examples/time_scenario_validation.py
            examples/qualify_recursive_validation.py
            examples/qualification_validation_protocol.md
            .github/workflows/recursive-qualification.yml
            examples/study_manifests/recursive-qualification*.json
            examples/results/2026-10-14-recursive-preview-validation/scenario-timing-completed-38645875109/audit/verification.json
            examples/results/2026-10-14-recursive-qualification/noise-gate/audit.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned package/runtime and verify source
        timeout-minutes: 2
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I examples/qualify_recursive_validation.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 runtime.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-${{ inputs.stage }}-authorization
          path: authorization
      - name: Fit one fresh dataset
        timeout-minutes: ${{ matrix.compute_minutes }}
        run: |
          python -I examples/qualify_recursive_validation.py case --stage $env:STAGE --index ${{ matrix.index }} --out .superpowers/qualification-case --authorization authorization/authorization.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve available checkpoints without fitting
        if: always()
        timeout-minutes: 1
        run: python -I examples/qualify_recursive_validation.py pack --out .superpowers/qualification-case
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 1
        with:
          name: qualification-${{ inputs.stage }}-${{ matrix.index }}
          path: |
            .superpowers/qualification-case/control.json
            .superpowers/qualification-case/raw/
            runtime.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success'
    needs: [prepare, case]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            .github/workflows/recursive-preview-validation.yml
            examples/recursive_preview_*.py
            examples/recursive_preview_validation_protocol.md
            examples/recursive_preview_continuation_proposal.md
            examples/study_manifests/recursive-preview-*.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/raw/producer-manifest.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/raw/preflight.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/audit/raw-sha256.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38615814397/audit/diagnosis.json
            examples/results/2026-10-14-recursive-preview-validation/preflight-failure-38621370295/raw/producer-manifest.json
            examples/results/2026-10-14-recursive-preview-validation/timing-completed-38629900589/audit/verification.json
            examples/results/2026-10-14-recursive-preview-validation/timing-completed-38629900589/audit/raw-sha256.json
            examples/time_scenario_validation.py
            examples/qualify_recursive_validation.py
            examples/qualification_validation_protocol.md
            .github/workflows/recursive-qualification.yml
            examples/study_manifests/recursive-qualification*.json
            examples/results/2026-10-14-recursive-preview-validation/scenario-timing-completed-38645875109/audit/verification.json
            examples/results/2026-10-14-recursive-qualification/noise-gate/audit.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned package/runtime and verify source
        timeout-minutes: 2
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I examples/qualify_recursive_validation.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 runtime.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: qualification-${{ inputs.stage }}-*
          path: inputs
      - name: Independently replay every available case without fitting
        timeout-minutes: 50
        run: |
          python -I examples/qualify_recursive_validation.py aggregate --stage $env:STAGE --inputs inputs --out .superpowers/qualification-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 4
        with:
          name: qualification-${{ inputs.stage }}-audit
          path: .superpowers/qualification-audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
