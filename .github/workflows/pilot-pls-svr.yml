name: Pilot PLS and SVR
# Edge-case pilot of the experimental engines: 10 scenarios x 3 datasets per engine
# (examples/pilot_pls_svr.py). Local smoke timing per dataset: PLS 2-15 s, SVR 13-26 s.
# Estimates per job (4 workers, runner ~2x slower): OLS 5, Elastic-Net 10, PLS 5,
# SVR 10, LightGBM 30 minutes; timeouts are 3x (owner rule).
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pilot-pls-svr
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  engine:
    name: engine (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: ols, timeout: 15}
          - {engine: elastic_net, timeout: 30}
          - {engine: lightgbm, timeout: 90}
          - {engine: pls, timeout: 15}
          - {engine: svr, timeout: 30}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/pilot_pls_svr.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0
          python -m pip check
      - name: Run
        run: |
          workers=$(python -c 'import os; print(os.cpu_count())')
          echo "cpu count: $workers"
          python -I examples/pilot_pls_svr.py run --engines ${{ matrix.engine }} --reps 0:3 --out .pilot --workers "$workers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot-pls-svr-${{ matrix.engine }}
          path: .pilot/
          include-hidden-files: true
          if-no-files-found: warn
  aggregate:
    needs: engine
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/pilot_pls_svr.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pilot-pls-svr-*
          path: runs
      - name: Aggregate
        run: python -I examples/pilot_pls_svr.py aggregate --runs runs --out results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-results
          path: results/
