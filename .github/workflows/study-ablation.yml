name: Study ablation
# Noise-bar and recursion ablation: 3 engines x 8 core cells x datasets 0-99, arms full and nobar
# (max_depth 3), plus depth-1 integrity reruns for datasets 0-4. One shard = 10 datasets.
# Shard sizes and timeouts are provisional (pre-probe estimate per shard: OLS 40, Elastic-Net 70,
# LightGBM 100 runner-minutes; timeouts 3x, owner rule): revise from the probe before running.
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
concurrency:
  group: study-ablation
  cancel-in-progress: false
jobs:
  shard:
    name: shard (${{ matrix.engine }}, ${{ matrix.n }}, ${{ matrix.pool }}, ${{ matrix.shape }}, ${{ matrix.reps }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {engine: ols, n: 1000, pool: 13, shape: linear, reps: '0:10', timeout: 120}
          - {engine: ols, n: 1000, pool: 13, shape: linear, reps: '10:20', timeout: 120}
          - {engine: ols, n: 1000, pool: 13, shape: linear, reps: '20:30', timeout: 120}
