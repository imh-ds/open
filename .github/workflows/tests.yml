name: Tests
'on':
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0 matplotlib==3.9.2 pytest==8.3.3 statsmodels==0.14.4 patsy==1.0.1 packaging==23.2
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Install the built wheel and check the public API
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python - <<'PY'
          import open.api as api
          assert api.analyze is api.analyse
          for name in ("explore", "confirm", "evaluate_fit", "save_split", "save_batch"):
              assert callable(getattr(api, name))
          PY
      - name: Install optional extras from wheel metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheel = next(Path("dist").glob("*.whl")).resolve()
          requirement = f"open-predictive-expansion[visualization,lightgbm] @ {wheel.as_uri()}"
          subprocess.run([sys.executable, "-m", "pip", "install", requirement], check=True)
          PY
          python - <<'PY'
          import lightgbm
          import matplotlib
          PY
