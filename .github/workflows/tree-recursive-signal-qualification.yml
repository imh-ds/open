name: Tree-engine recursive matched-chain qualification
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/multiengine-preflight
    paths:
    - .github/workflows/tree-recursive-signal-qualification.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tree-recursive-signal-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - run: echo 'Workflow registration only; no scientific fits.'
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      matrix80: ${{ steps.matrix.outputs.matrix80 }}
      matrix200: ${{ steps.matrix.outputs.matrix200 }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/**
          README.md
          LICENSE
          configs/default.yaml
          pyproject.toml
          examples/recursive_preview_design.py
          examples/recursive_preview_runner.py
          examples/recursive_preview_actions.py
          examples/recursive_preview_equivalence.py
          examples/recursive_preview_audit.py
          examples/qualification_artifacts.py
          examples/multiengine_recursive_audit.py
          examples/optimized_rf_recursive_audit.py
          examples/tree_recursive_signal_audit.py
          examples/qualify_tree_recursive_validation.py
          examples/results/2026-10-16-multiengine-null-audit-correction/study-report-corrected.json
          examples/qualify_tree_recursive_signal.py
          examples/tree_recursive_signal_study.py
          examples/study_manifests/tree-recursive-signal.json
          examples/tree_recursive_null_evidence.py
          examples/tree_recursive_signal_actions.py
          .github/workflows/tree-recursive-signal-qualification.yml
          examples/tree_recursive_signal_validation_protocol.md
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned runtime and check immutable sources
      timeout-minutes: 5
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip install --no-build-isolation --no-deps .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/tree_recursive_signal_actions.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - id: matrix
      name: Prepare both paired waves without fitting models
      timeout-minutes: 20
      run: |
        $prepared = python examples/tree_recursive_signal_actions.py prepare --out .superpowers/tree-signal-authorization
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $matrix = $prepared | ConvertFrom-Json
        "matrix80=$($matrix.matrix80)" >> $env:GITHUB_OUTPUT
        "matrix200=$($matrix.matrix200)" >> $env:GITHUB_OUTPUT
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      name: Upload authorization
      if: always()
      timeout-minutes: 5
      with:
        name: tree-signal-authorization
        path: .superpowers/tree-signal-authorization/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
  case-n80:
    name: case N=80 (${{ matrix.id }})
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.case_cap_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix80) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/**
          README.md
          LICENSE
          configs/default.yaml
          pyproject.toml
          examples/recursive_preview_design.py
          examples/recursive_preview_runner.py
          examples/recursive_preview_actions.py
          examples/recursive_preview_equivalence.py
          examples/recursive_preview_audit.py
          examples/qualification_artifacts.py
          examples/multiengine_recursive_audit.py
          examples/optimized_rf_recursive_audit.py
          examples/tree_recursive_signal_audit.py
          examples/qualify_tree_recursive_validation.py
          examples/results/2026-10-16-multiengine-null-audit-correction/study-report-corrected.json
          examples/qualify_tree_recursive_signal.py
          examples/tree_recursive_signal_study.py
          examples/study_manifests/tree-recursive-signal.json
          examples/tree_recursive_null_evidence.py
          examples/tree_recursive_signal_actions.py
          .github/workflows/tree-recursive-signal-qualification.yml
          examples/tree_recursive_signal_validation_protocol.md
    - id: start
      name: Capture case job start for its soft deadline
      run: |
        $started = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
        "epoch=$started" >> $env:GITHUB_OUTPUT
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned runtime
      timeout-minutes: 5
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip install --no-build-isolation --no-deps .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/tree_recursive_signal_actions.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: tree-signal-authorization
        path: .superpowers/tree-signal-authorization/
    - id: execute
      name: Run one frozen recursive signal case; no automatic retries
      continue-on-error: true
      run: |
        python examples/tree_recursive_signal_actions.py case --id '${{ matrix.id }}' --sample-size 80 --authorization .superpowers/tree-signal-authorization/wave-n80 --out .superpowers/case-output --job-started-at ${{ steps.start.outputs.epoch }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      name: Upload case evidence
      if: always()
      timeout-minutes: 5
      with:
        name: tree-signal-case-${{ matrix.id }}
        path: .superpowers/case-output/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 30
    - name: Preserve incomplete status as a failed case
      if: always() && steps.execute.outcome == 'failure'
      run: exit 1
  case-n200:
    name: case N=200 (${{ matrix.id }})
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.case_cap_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix200) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/**
          README.md
          LICENSE
          configs/default.yaml
          pyproject.toml
          examples/recursive_preview_design.py
          examples/recursive_preview_runner.py
          examples/recursive_preview_actions.py
          examples/recursive_preview_equivalence.py
          examples/recursive_preview_audit.py
          examples/qualification_artifacts.py
          examples/multiengine_recursive_audit.py
          examples/optimized_rf_recursive_audit.py
          examples/tree_recursive_signal_audit.py
          examples/qualify_tree_recursive_validation.py
          examples/results/2026-10-16-multiengine-null-audit-correction/study-report-corrected.json
          examples/qualify_tree_recursive_signal.py
          examples/tree_recursive_signal_study.py
          examples/study_manifests/tree-recursive-signal.json
          examples/tree_recursive_null_evidence.py
          examples/tree_recursive_signal_actions.py
          .github/workflows/tree-recursive-signal-qualification.yml
          examples/tree_recursive_signal_validation_protocol.md
    - id: start
      name: Capture case job start for its soft deadline
      run: |
        $started = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
        "epoch=$started" >> $env:GITHUB_OUTPUT
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned runtime
      timeout-minutes: 5
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip install --no-build-isolation --no-deps .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/tree_recursive_signal_actions.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: tree-signal-authorization
        path: .superpowers/tree-signal-authorization/
    - id: execute
      name: Run one frozen recursive signal case; no automatic retries
      continue-on-error: true
      run: |
        python examples/tree_recursive_signal_actions.py case --id '${{ matrix.id }}' --sample-size 200 --authorization .superpowers/tree-signal-authorization/wave-n200 --out .superpowers/case-output --job-started-at ${{ steps.start.outputs.epoch }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      name: Upload case evidence
      if: always()
      timeout-minutes: 5
      with:
        name: tree-signal-case-${{ matrix.id }}
        path: .superpowers/case-output/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 30
    - name: Preserve incomplete status as a failed case
      if: always() && steps.execute.outcome == 'failure'
      run: exit 1
  audit:
    needs:
    - prepare
    - case-n80
    - case-n200
    if: always() && needs.prepare.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/**
          README.md
          LICENSE
          configs/default.yaml
          pyproject.toml
          examples/recursive_preview_design.py
          examples/recursive_preview_runner.py
          examples/recursive_preview_actions.py
          examples/recursive_preview_equivalence.py
          examples/recursive_preview_audit.py
          examples/qualification_artifacts.py
          examples/multiengine_recursive_audit.py
          examples/optimized_rf_recursive_audit.py
          examples/tree_recursive_signal_audit.py
          examples/qualify_tree_recursive_validation.py
          examples/results/2026-10-16-multiengine-null-audit-correction/study-report-corrected.json
          examples/qualify_tree_recursive_signal.py
          examples/tree_recursive_signal_study.py
          examples/study_manifests/tree-recursive-signal.json
          examples/tree_recursive_null_evidence.py
          examples/tree_recursive_signal_actions.py
          .github/workflows/tree-recursive-signal-qualification.yml
          examples/tree_recursive_signal_validation_protocol.md
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned audit runtime
      timeout-minutes: 5
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip install --no-build-isolation --no-deps .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/tree_recursive_signal_actions.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: tree-signal-authorization
        path: .superpowers/tree-signal-authorization/
    - name: Independently audit 55 frozen chain cases
      timeout-minutes: 100
      run: python examples/tree_recursive_signal_actions.py aggregate --engine '${{ matrix.engine }}' --sample-size ${{ matrix.sample_size }}
        --downloads .superpowers/signal-downloads --out .superpowers/signal-cell
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      name: Upload cell audit report
      if: always()
      with:
        name: tree-signal-report-${{ matrix.engine }}-n${{ matrix.sample_size }}
        path: .superpowers/signal-cell/cell-report.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      name: Upload durable cell bundles
      if: always()
      timeout-minutes: 10
      with:
        name: tree-signal-publication-${{ matrix.engine }}-n${{ matrix.sample_size }}
        path: .superpowers/signal-cell/publication/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    name: audit (${{ matrix.engine }}, N=${{ matrix.sample_size }})
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        engine:
        - random_forest
        - gbm
        - lightgbm
        sample_size:
        - 80
        - 200
  combine:
    needs:
    - prepare
    - audit
    if: always() && needs.prepare.result == 'success' && needs.audit.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/**
          README.md
          LICENSE
          configs/default.yaml
          pyproject.toml
          examples/recursive_preview_design.py
          examples/recursive_preview_runner.py
          examples/recursive_preview_actions.py
          examples/recursive_preview_equivalence.py
          examples/recursive_preview_audit.py
          examples/qualification_artifacts.py
          examples/multiengine_recursive_audit.py
          examples/optimized_rf_recursive_audit.py
          examples/tree_recursive_signal_audit.py
          examples/qualify_tree_recursive_validation.py
          examples/results/2026-10-16-multiengine-null-audit-correction/study-report-corrected.json
          examples/qualify_tree_recursive_signal.py
          examples/tree_recursive_signal_study.py
          examples/study_manifests/tree-recursive-signal.json
          examples/tree_recursive_null_evidence.py
          examples/tree_recursive_signal_actions.py
          .github/workflows/tree-recursive-signal-qualification.yml
          examples/tree_recursive_signal_validation_protocol.md
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned audit runtime
      timeout-minutes: 5
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip install --no-build-isolation --no-deps .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/tree_recursive_signal_actions.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Combine six fixed-denominator audit cells
      run: python examples/tree_recursive_signal_actions.py combine --downloads .superpowers/signal-reports --out .superpowers/signal-combined
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      name: Upload final report
      with:
        name: tree-signal-combined
        path: .superpowers/signal-combined/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
  publish:
    needs: combine
    if: always() && needs.combine.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 270
    permissions:
      contents: write
      actions: read
    concurrency:
      group: tree-recursive-signal-release
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/**
          README.md
          LICENSE
          configs/default.yaml
          pyproject.toml
          examples/recursive_preview_design.py
          examples/recursive_preview_runner.py
          examples/recursive_preview_actions.py
          examples/recursive_preview_equivalence.py
          examples/recursive_preview_audit.py
          examples/qualification_artifacts.py
          examples/multiengine_recursive_audit.py
          examples/optimized_rf_recursive_audit.py
          examples/tree_recursive_signal_audit.py
          examples/qualify_tree_recursive_validation.py
          examples/results/2026-10-16-multiengine-null-audit-correction/study-report-corrected.json
          examples/qualify_tree_recursive_signal.py
          examples/tree_recursive_signal_study.py
          examples/study_manifests/tree-recursive-signal.json
          examples/tree_recursive_null_evidence.py
          examples/tree_recursive_signal_actions.py
          .github/workflows/tree-recursive-signal-qualification.yml
          examples/tree_recursive_signal_validation_protocol.md
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned audit runtime
      timeout-minutes: 5
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip install --no-build-isolation --no-deps .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/tree_recursive_signal_actions.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: tree-signal-combined
        path: .superpowers/signal-combined/
    - name: Publish and verify cell bundles sequentially
      run: python examples/tree_recursive_signal_actions.py publish --publication .superpowers/signal-combined
