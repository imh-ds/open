      timeout-minutes: 5
      run: 'python -I examples/validate_optimized_rf.py download --out .superpowers/optimized-rf-inputs

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Independent observation-loss replay; zero model fits
      if: always()
      timeout-minutes: 18
      run: 'python -I examples/validate_optimized_rf.py aggregate --inputs .superpowers/optimized-rf-inputs --out
        .superpowers/optimized-rf-audit

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      timeout-minutes: 2
      with:
        name: optimized-rf-audit
        path: '.superpowers/optimized-rf-audit/

          .superpowers/optimized-rf-inputs/download-inventory.json

          runtime.txt'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
