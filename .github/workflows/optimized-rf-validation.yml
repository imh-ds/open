    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - name: Install pinned package/runtime and verify source
      timeout-minutes: 3
      run: 'python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2
        PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

