name: Selection reliability study

on:
  workflow_dispatch:
  push:
    branches: [codex/actions-selection-reliability]
    paths:
      - .github/workflows/selection-reliability.yml
      - examples/study_transfers/**

permissions:
  contents: read

concurrency:
  group: selection-reliability-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 PyYAML==6.0.2
      - run: python examples/selection_actions.py restore
      - id: matrix
        run: |
          $cases = python examples/selection_actions.py matrix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "cases=$cases" >> $env:GITHUB_OUTPUT

  case:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.cases) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 PyYAML==6.0.2
      - run: python examples/selection_actions.py restore
      - run: python examples/selection_actions.py case --case '${{ matrix.case }}' --workers 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selection-case-${{ matrix.case }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
          path: |
            examples/results/2026-10-10-selection-reliability/${{ matrix.case }}/
            .superpowers/selection-checkpoints/2026-10-10-selection-reliability/${{ matrix.case }}/

  audit:
    needs: [prepare, case]
    if: always() && needs.prepare.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 PyYAML==6.0.2 matplotlib==3.10.7
      - run: python examples/selection_actions.py restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: selection-case-*
          merge-multiple: true
          path: .
      - run: python examples/selection_actions.py finalize
      - run: python examples/audit_selection_reliability.py examples/results/2026-10-10-selection-reliability
      - run: python examples/build_selection_reliability_report.py examples/results/2026-10-10-selection-reliability
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selection-study-audited-results
          retention-days: 30
          if-no-files-found: error
          path: examples/results/2026-10-10-selection-reliability/
