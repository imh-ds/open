name: Shipped-default preview fixture pilot

on:
  workflow_dispatch:
  push:
    branches: [codex/actions-selection-reliability]
    paths: [.github/workflows/default-preview-pilot.yml]

permissions:
  contents: read

concurrency:
  group: shipped-default-preview-pilot
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: Write-Output 'Register workflow only; no package installation or model fits.'
  fixture:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [chain, chain_missing, shared_predictors]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            examples/default_preview_pilot.py
            examples/results/2026-10-08-layer-fixtures/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime and non-editable package
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 runtime.txt
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all 100 resamples with shipped CV and memory tracking
        timeout-minutes: 160
        run: |
          python -I examples/default_preview_pilot.py --case '${{ matrix.case }}' --out '.superpowers/default-pilot/${{ matrix.case }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 10
        with:
          name: default-pilot-${{ matrix.case }}
          path: |
            .superpowers/default-pilot/
            runtime.txt
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: fixture
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 19
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: default-pilot-*
          path: evidence
      - name: Audit all three planned receipts without fitting
        run: |
          $receipts = @(Get-ChildItem -LiteralPath evidence -Recurse -Filter receipt.json | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          $summary = [ordered]@{ planned_cases = 3; received_cases = $receipts.Count; receipts = $receipts; scope = 'Fixed-fixture default runtime/regression only; no scientific error-rate estimate' }
          $summary | ConvertTo-Json -Depth 100 | Out-File -Encoding utf8 evidence/summary.json
          if ($receipts.Count -ne 3) { throw 'Missing planned receipt' }
          $expected = @('chain', 'chain_missing', 'shared_predictors')
          $actual = @($receipts.case | Sort-Object)
          if (Compare-Object $expected $actual) { throw 'Case identities differ' }
          foreach ($r in $receipts) {
            if ($r.status -ne 'COMPLETE' -or $r.planned_resamples_per_target -ne 100 -or $r.completed_assessment_count -ne $r.assessment_count) { throw 'Incomplete default fixture' }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: default-pilot-combined-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
