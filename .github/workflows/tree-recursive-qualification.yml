name: Tree-engine recursive null qualification
'on':
  workflow_dispatch: {}
  push:
    branches:
      - codex/multiengine-preflight
    paths:
      - .github/workflows/tree-recursive-qualification.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: tree-recursive-null-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Workflow registration only; no scientific fits.'

  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      matrix80: ${{ steps.matrix.outputs.matrix80 }}
      matrix200: ${{ steps.matrix.outputs.matrix200 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            examples/recursive_preview_design.py
            examples/recursive_preview_runner.py
            examples/recursive_preview_actions.py
            examples/multiengine_recursive_audit.py
            examples/optimized_rf_recursive_audit.py
            examples/qualify_tree_recursive_validation.py
            examples/tree_recursive_qualification_audit.py
            examples/tree_recursive_null_study.py
            examples/tree_recursive_null_evidence.py
            examples/tree_recursive_null_actions.py
            examples/qualification_artifacts.py
            examples/study_manifests/tree-recursive-null.json
            examples/tree_recursive_null_validation_protocol.md
            .github/workflows/tree-recursive-qualification.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime and check immutable sources
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/tree_recursive_null_actions.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: matrix
        name: Prepare both paired waves without fitting models
        timeout-minutes: 20
        run: |
          $prepared = python examples/tree_recursive_null_actions.py prepare --out .superpowers/tree-null-authorization
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matrix = $prepared | ConvertFrom-Json
          "matrix80=$($matrix.matrix80)" >> $env:GITHUB_OUTPUT
          "matrix200=$($matrix.matrix200)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        name: Upload authorization
        if: always()
        timeout-minutes: 5
        with:
          name: tree-null-authorization
          path: .superpowers/tree-null-authorization/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  case-n80:
    name: case N=80 (${{ matrix.id }})
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.case_cap_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix80) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            examples/recursive_preview_design.py
            examples/recursive_preview_runner.py
            examples/recursive_preview_actions.py
            examples/multiengine_recursive_audit.py
            examples/optimized_rf_recursive_audit.py
            examples/qualify_tree_recursive_validation.py
            examples/tree_recursive_qualification_audit.py
            examples/tree_recursive_null_study.py
            examples/tree_recursive_null_evidence.py
            examples/tree_recursive_null_actions.py
            examples/qualification_artifacts.py
            examples/study_manifests/tree-recursive-null.json
            examples/tree_recursive_null_validation_protocol.md
            .github/workflows/tree-recursive-qualification.yml
      - id: start
        name: Capture case job start for its soft deadline
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "epoch=$started" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/tree_recursive_null_actions.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tree-null-authorization
          path: .superpowers/tree-null-authorization/
      - id: execute
        name: Run one frozen recursive null case; no automatic retries
        continue-on-error: true
        run: |
          python examples/tree_recursive_null_actions.py case --id '${{ matrix.id }}' --sample-size 80 --authorization .superpowers/tree-null-authorization/wave-n80 --out .superpowers/case-output --job-started-at ${{ steps.start.outputs.epoch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        name: Upload case evidence
        if: always()
        timeout-minutes: 5
        with:
          name: tree-null-case-${{ matrix.id }}
          path: .superpowers/case-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve incomplete status as a failed case
        if: always() && steps.execute.outcome == 'failure'
        run: exit 1

  case-n200:
    name: case N=200 (${{ matrix.id }})
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.case_cap_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix200) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            examples/recursive_preview_design.py
            examples/recursive_preview_runner.py
            examples/recursive_preview_actions.py
            examples/multiengine_recursive_audit.py
            examples/optimized_rf_recursive_audit.py
            examples/qualify_tree_recursive_validation.py
            examples/tree_recursive_qualification_audit.py
            examples/tree_recursive_null_study.py
            examples/tree_recursive_null_evidence.py
            examples/tree_recursive_null_actions.py
            examples/qualification_artifacts.py
            examples/study_manifests/tree-recursive-null.json
            examples/tree_recursive_null_validation_protocol.md
            .github/workflows/tree-recursive-qualification.yml
      - id: start
        name: Capture case job start for its soft deadline
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "epoch=$started" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/tree_recursive_null_actions.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tree-null-authorization
          path: .superpowers/tree-null-authorization/
      - id: execute
        name: Run one frozen recursive null case; no automatic retries
        continue-on-error: true
        run: |
          python examples/tree_recursive_null_actions.py case --id '${{ matrix.id }}' --sample-size 200 --authorization .superpowers/tree-null-authorization/wave-n200 --out .superpowers/case-output --job-started-at ${{ steps.start.outputs.epoch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        name: Upload case evidence
        if: always()
        timeout-minutes: 5
        with:
          name: tree-null-case-${{ matrix.id }}
          path: .superpowers/case-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve incomplete status as a failed case
        if: always() && steps.execute.outcome == 'failure'
        run: exit 1

  aggregate:
    needs: [prepare, case-n80, case-n200]
    if: always() && needs.prepare.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            configs/default.yaml
            examples/recursive_preview_design.py
            examples/recursive_preview_runner.py
            examples/recursive_preview_actions.py
            examples/multiengine_recursive_audit.py
            examples/optimized_rf_recursive_audit.py
            examples/qualify_tree_recursive_validation.py
            examples/tree_recursive_qualification_audit.py
            examples/tree_recursive_null_study.py
            examples/tree_recursive_null_evidence.py
            examples/tree_recursive_null_actions.py
            examples/qualification_artifacts.py
            examples/study_manifests/tree-recursive-null.json
            examples/tree_recursive_null_validation_protocol.md
            .github/workflows/tree-recursive-qualification.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned audit runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/tree_recursive_null_actions.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tree-null-authorization
          path: .superpowers/tree-null-authorization/
      - name: Audit every planned case and both fixed-denominator waves
        timeout-minutes: 150
        run: |
          python examples/tree_recursive_null_actions.py aggregate --downloads .superpowers/tree-null-downloads --out .superpowers/tree-null-aggregate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        name: Upload audit and durable raw bundles
        if: always()
        timeout-minutes: 10
        with:
          name: tree-null-publication
          path: .superpowers/tree-null-aggregate/publication/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: aggregate
    if: always() && needs.aggregate.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 45
    concurrency:
      group: tree-recursive-null-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/**
            pyproject.toml
            README.md
            LICENSE
            examples/recursive_preview_design.py
            examples/recursive_preview_runner.py
            examples/recursive_preview_actions.py
            examples/multiengine_recursive_audit.py
            examples/optimized_rf_recursive_audit.py
            examples/qualify_tree_recursive_validation.py
            examples/tree_recursive_qualification_audit.py
            examples/tree_recursive_null_study.py
            examples/tree_recursive_null_evidence.py
            examples/tree_recursive_null_actions.py
            examples/study_manifests/tree-recursive-null.json
            examples/tree_recursive_null_validation_protocol.md
            .github/workflows/tree-recursive-qualification.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install release verifier
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 matplotlib==3.9.2 PyYAML==6.0.2 lightgbm==4.6.0 setuptools==75.1.0 wheel==0.45.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tree-null-publication
          path: .superpowers/tree-null-publication/
      - name: Publish durable prerelease and verify remote asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python examples/tree_recursive_null_actions.py publish --publication .superpowers/tree-null-publication
