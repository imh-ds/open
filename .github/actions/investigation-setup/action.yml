name: Investigation environment
description: Pinned environment for the frozen selection investigation
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.9
    - shell: pwsh
      run: |
        python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.11.2 scikit-learn==1.3.0 PyYAML==6.0.2
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python examples/selection_investigation.py freeze
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
